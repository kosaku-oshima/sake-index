<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>sake-index</title>

        <link rel="stylesheet" href="css/index.css">
    </head>
    <body>
        <nav>
            <h1><a href="index.html" class="logo">Sake-index</a></h1>
            <ul class="menu">
                <li><a id="indexMenuBtn">一覧</a></li>
                <li><a id="searchMenuBtn">検索</a></li>
                <li><a id="registerMenuBtn">追加</a></li>
                <li><a id="exportMenuBtn">データ出力</a></li>
            </ul>
        </nav>
        <main>
            <div class="container">
                <!-- <h1>一覧</h1> -->
                <div class="button-group">
                    <div class="sort-select">
                        <label for="sortOrder">並び替え</label>
                        <select id="sortOrder" name="sortOrder">
                            <option value="createdAt-desc" selected>登録日が新しい順</option>
                            <option value="createdAt-asc">登録日が古い順</option>
                            <option value="name-asc">酒名昇順</option>
                            <option value="name-desc">酒名降順</option>
                            <option value="rating-desc">お気に入り度が高い順</option>
                            <option value="rating-asc">お気に入り度が低い順</option>
                        </select>                        
                    </div>
                    <div class="list-header">
                        <button type="button" id="clearFilterBtn" class="clear-filter" hidden>絞り込みを解除</button>
                        <p id="resultCount" class="result-count"></p>
                    </div>
                </div>
                <div class="card-list">
                    <!--ここにindex.jsで生成したhtmlが入る-->
                </div>
            </div>
        </main>
        <script type="module" src="js/index.js"></script>
    </body>
</html>
